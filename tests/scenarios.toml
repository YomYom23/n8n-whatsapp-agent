# --- P4: booking --------------------------------------------------------------------
# Scenario time: Tue 2026-12-01 10:00 New York. With 12 hours notice the first offered times are
# Wed, Thu and Fri at 8 AM (slot-20261202T1300Z, slot-20261203T1300Z, slot-20261204T1300Z).

# CUJ 2: service, address in the service area, then "2" books Thursday 8 AM.
[[scenario]]
name = "booking_deep_clean"
step = "P4"
now = "2026-12-01T15:00:00Z"

[[scenario.event]]
source = "meta"
signing = "valid"
fixture = "tests/fixtures/meta/text.json"
text = "I'd like a deep clean"

[[scenario.event]]
source = "meta"
signing = "valid"
fixture = "tests/fixtures/meta/text.json"
text = "12 Main St, New York NY 10001"

[[scenario.event]]
source = "meta"
signing = "valid"
fixture = "tests/fixtures/meta/text.json"
text = "2"

[scenario.script]
jev.stage = [{ hazards = {}, answer = { value = "deep_clean", confidence = 0.9 } }, { hazards = {} }]

[scenario.expect]
route = "number_pick"
sends = [{ kind = "normal", text_contains = "address for the clean" }, { kind = "normal", text_contains = "Here are the next times we have open" }, { kind = "normal", text_contains = "You're booked for Thursday December 3 at 8 AM" }]
