signing = "valid"
fixture = "tests/fixtures/meta/text.json"
text = "what does a deep clean include?"

[scenario.script]
jev.stage = [{ hazards = {}, answer = { value = "other_question", confidence = 0.9 } }]
jev.draft_check = [{ problems = { unsupported_fact = 0.9 } }]
haiku = [{ text = "A deep clean covers inside the fridge, baseboards and window sills.", input_tokens = 900, output_tokens = 40 }]

[scenario.expect]
route = "other_question"
sends = [{ kind = "normal", text_contains = "can't answer that one properly" }]
problems = ["unsupported_fact"]
