# Live instance: n8n behind Caddy. Only /webhook/* is public (see Caddyfile).
# The editor is bound to 127.0.0.1 and reached locally or through an SSH tunnel.
#
# Start:  docker compose --env-file deploy/live.env -f deploy/docker-compose.live.yml up -d
# Stop:   docker compose --env-file deploy/live.env -f deploy/docker-compose.live.yml down
#
# On a server, Caddy terminates HTTPS itself (SITE_ADDRESS = the hostname).
# During development a tunnel (ngrok) terminates HTTPS and forwards to Caddy's
# local HTTP port instead (SITE_ADDRESS=:80, CADDY_BIND=127.0.0.1); see live.env.example.

name: wa-agent-live

services:
  n8n:
    image: n8nio/n8n:2.49.5
    restart: unless-stopped
    env_file: live.env
    environment:
      N8N_HOST: ${N8N_HOST}
      N8N_PROTOCOL: https
      WEBHOOK_URL: ${WEBHOOK_URL}
      N8N_EDITOR_BASE_URL: http://localhost:5678
      N8N_PROXY_HOPS: ${N8N_PROXY_HOPS:-1}
      N8N_BLOCK_ENV_ACCESS_IN_NODE: "false"
      NODE_FUNCTION_ALLOW_BUILTIN: crypto
      GENERIC_TIMEZONE: ${BUSINESS_TZ:-America/New_York}
      TZ: ${BUSINESS_TZ:-America/New_York}
    ports:
      - "127.0.0.1:5678:5678"
    volumes:
      - n8n_data:/home/node/.n8n

  caddy:
    image: caddy:2.10.2
    restart: unless-stopped
    environment:
      SITE_ADDRESS: ${SITE_ADDRESS}
    ports:
      - "${CADDY_BIND:-0.0.0.0}:${CADDY_HTTP_PORT:-80}:80"
      - "${CADDY_BIND:-0.0.0.0}:${CADDY_HTTPS_PORT:-443}:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - n8n

volumes:
  n8n_data:
  caddy_data:
  caddy_config:
